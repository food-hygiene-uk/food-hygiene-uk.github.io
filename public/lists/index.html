  <script>
    "use strict";
{
  const updateColorScheme = (mql) => {
    const prefers = mql?.matches ? "dark" : "light";
    const setting = localStorage.getItem("color-scheme");

    document.documentElement.setAttribute(
      "data-color-scheme",
      setting ?? prefers,
    );
  };
  const colorSchemeMQL = globalThis?.matchMedia?.(
    "(prefers-color-scheme:dark)",
  );
  colorSchemeMQL.addEventListener("change", function (e) {
    updateColorScheme(e);
  });

  updateColorScheme(colorSchemeMQL);
}

  </script>
  <style>
    :root {
  /* Information and background colors */
  --primary-blue: #2c4c6b;
  --light-blue: #f5f7fa;
  --teal: #3c7b8e;
  --grey: #687789;
  --light-grey: #eef2f6;
  --hygiene-green-rgb: 132, 190, 0;
  --hygiene-green: rgb(var(--hygiene-green-rgb));

  /* Call to action colors */
  --cta-default: #9e66ff;

  --body-background: var(--light-blue);
  --text-color: #000;
  --header-background-color: #f8f9fa;
  --header-text-color: var(--text-color);
  --header-rule-color: #e0e0e0;
  --background-highlight-color: #e5e8f1;
  --text-highlight-color: var(--text-color);
}

@media (not (scripting: none)) or (prefers-color-scheme: dark) {
  html:not([data-color-scheme="light"]) {
    --body-background: #000;
    --text-color: #757575;
    --header-background-color: #1f2021;
    --header-text-color: #dfdfdf;
    --header-rule-color: #383838;
    --background-highlight-color: var(--light-blue);
    --text-highlight-color: var(--text-color);

}

body {
  font-family: system-ui, -apple-system, sans-serif;
  line-height: 1.6;
  margin: 0;
  padding: 0;

  color: var(--text-color);
}

a {
  color: #0052a3;
  text-decoration: none;
}

a:hover {

}

.container {

  margin: 0 auto;

}

    .content-unlqm {
  display: contents;

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  h1 {
    font-size: 2em;
    margin-bottom: 1.5rem;
    color: var(--hygiene-green);
  }

  .lists-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  .list-item {
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    padding: 20px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .list-item:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  }

  .list-item h2 {
    margin-top: 0;
    color: var(--hygiene-green);
    font-size: 1.5em;
  }

  .list-item p {
    color: #666;
    margin-bottom: 20px;
  }

  .recent-list {
    border-left: 4px solid var(--hygiene-green);
  }

  .view-list-button {
    display: inline-block;
    background-color: var(--hygiene-green);
    color: white;
    padding: 8px 16px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: bold;
    transition: background-color 0.2s;
  }

  .view-list-button:hover {
    background-color: #005a30;
  }

  .no-lists-message {
    grid-column: 1 / -1;
    background-color: #f9f9f9;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    color: #666;
  }
}

    .component-header-97mkn {
  display: contents;

  header {
    background-color: var(--header-background-color);
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--header-rule-color);

  .navbar-97mkn {

  .nav-links-97mkn {

        font-weight: bold;
      }
    }
  }

  /* Hamburger menu checkbox (hidden) */
  .menu-toggle-97mkn {
    display: none;
  }

  /* Hamburger icon */
  .hamburger-97mkn {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 30px;
    height: 21px;
    cursor: pointer;
    z-index: 10;
  }

  .hamburger-97mkn span {
    display: block;
    height: 3px;
    width: 100%;
    background-color: var(--header-text-color);
    border-radius: 3px;
    transition: all 0.3s ease-in-out;
  }

  /* Mobile Styles */
  @media (max-width: 768px) {
    .hamburger-97mkn {
      display: flex;
    }

    .nav-links-97mkn {
      position: fixed;
      top: 84px; /* Ensures it doesn't cover the title bar */
      right: -100%;
      width: 100%;
      height: calc(100vh - 84px);
      flex-direction: column;
      background-color: var(--header-background-color);
      padding: 2rem;
      transition: right 0.3s ease-in-out;
      z-index: 5;
      text-align: right;
      gap: 2rem;

      li {
        display: block;
        margin-bottom: 1.5rem;

        a {
          font-size: 1.2rem;
        }
      }
    }

    /* Show menu when checkbox is checked */
    .menu-toggle-97mkn:checked ~ .nav-links-97mkn {
      right: 0;
    }

    /* Hamburger animation */
    .menu-toggle-97mkn:checked
      ~ .hamburger-97mkn
      span:nth-child(1) {
      transform: translateY(9px) rotate(45deg);
    }

    .menu-toggle-97mkn:checked
      ~ .hamburger-97mkn
      span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle-97mkn:checked
      ~ .hamburger-97mkn
      span:nth-child(3) {
      transform: translateY(-9px) rotate(-45deg);
    }
  }
}

    <script type="module">
      document.addEventListener("DOMContentLoaded", () => {
  const userListsContainer = document.getElementById("userLists");

  // This would be expanded in the future to support user-created lists
